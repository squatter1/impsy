# The configuration file for IMPSY: Interactive Musical Prediction System
# Default: 2D melody model over OSC with the prediction tree enabled, no hardware needed. See configs/ for other setups.

# Metadata about this configuration
title = "2D melody over OSC with prediction tree"
owner = "Scott Howsam"
description = "Predicts single-note melodies over OSC, guided by Monte Carlo tree search with musical heuristics"

# Basic config
log_input = true
log_predictions = false
verbose = true

# Interaction Configuration
[interaction]
mode = "callresponse" # Can be: "callresponse", "polyphony", "battle", "useronly"
threshold = 1.25 # number of seconds before switching in call-response mode
input_thru = false # sends inputs directly to outputs (e.g., if input interface is different than output synth)

# Model configuration
[model]
dimension = 2
file = "evaluation/models/2-musicMDRNN-dim2-layers2-units64-mixtures5-scale12.tflite"
size = "s" # Can be one of: xs, s, m, l, xl
sigmatemp = 0.01
pitemp = 1.5
timescale = 1

# Prediction tree configuration (2D only, see configs/default.toml for all options)
[prediction_tree]
enabled = true
preset = "improv" # Heuristic weights, can be: "improv", "nottingham"
memory_length = 45 # Number of recent notes the heuristics compare against
time_limit_ms = 100 # Search time per prediction

[osc]
server_ip = "localhost" # Address of IMPSY
server_port = 5000 # Port IMPSY listens on
client_ip = "localhost" # Address of the output device
client_port = 5002 # Port of the output device
